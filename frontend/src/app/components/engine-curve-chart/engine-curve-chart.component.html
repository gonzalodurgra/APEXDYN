<div class="chart-wrapper">
  <div class="chart-header">
    <div class="title-group">
      <span class="dot-indicator"></span>
      <h4>Curva Dinamométrica del Motor</h4>
    </div>
    <div class="legend-badges">
      <span class="legend-badge torque">
        <span class="color-box torque-box"></span> Par Motor (Nm)
      </span>
      <span class="legend-badge power">
        <span class="color-box power-box"></span> Potencia (CV)
      </span>
    </div>
  </div>
  <div class="canvas-container">
    <canvas #chartCanvas></canvas>
  </div>
</div>

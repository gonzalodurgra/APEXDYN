<div class="telemetry-chart-card">
  <div class="chart-header">
    <div class="title-block">
      <span class="status-pulse"></span>
      <h4>Telemetría QSS: Velocidad v(s) y Aceleraciones</h4>
    </div>
    <div class="telemetry-legend">
      <span class="legend-item"><span class="box speed-box"></span> Velocidad (km/h)</span>
      <span class="legend-item"><span class="box long-box"></span> G Longitudinal (G)</span>
    </div>
  </div>
  <div class="canvas-container">
    <canvas #chartCanvas></canvas>
  </div>
</div>
